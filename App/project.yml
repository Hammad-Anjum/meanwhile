name: Meanwhile
options:
  bundleIdPrefix: dev.meanwhile
  deploymentTarget:
    macOS: "14.0"
packages:
  MeanwhileKit:
    path: ..
  DynamicNotchKit:
    url: https://github.com/MrKai77/DynamicNotchKit
    from: 1.1.0
targets:
  Meanwhile:
    type: application
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: MeanwhileKit
        product: MeanwhileCore
      - package: DynamicNotchKit
    info:
      path: Sources/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        CFBundleDisplayName: Meanwhile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.meanwhile.app
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        # Ad-hoc signing until there is an Apple Developer account (task 5.7).
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
